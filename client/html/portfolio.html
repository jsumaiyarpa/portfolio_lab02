<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <link rel="stylesheet" href="../css/portfolio.css">
</head>

<body>

<header>

    <h1>Portfolio Generator</h1>

    <nav>

        <a href="#">Portfolio</a>
        <a href="form.html" id="editBtn">Edit Portfolio</a>
        <a href="#" id="logoutBtn">Logout</a>

    </nav>

</header>

<div class="container">

    <div class="profile-card">

        <h1 id="name"></h1>

        <p id="bio"></p>

    </div>

    <div class="card">

        <h2>Contact</h2>

        <p><b>Email:</b> <span id="email"></span></p>

        <p><b>Phone:</b> <span id="contact"></span></p>

    </div>

    <div class="card">

        <h2>Skills</h2>

        <p><b>Soft Skills:</b></p>

        <p id="softSkills"></p>

        <p><b>Technical Skills:</b></p>

        <p id="techSkills"></p>

    </div>

    <div class="card">

        <h2>Education</h2>

        <p id="institution"></p>

        <p id="degree"></p>

    </div>

    <div class="card">

        <h2>Experience</h2>

        <p id="company"></p>

        <p id="duration"></p>

        <p id="responsibilities"></p>

    </div>

    <div class="card">

        <h2>Projects</h2>

        <p id="projects"></p>

    </div>

</div>

<script src="../js/portfolio.js"></script>

</body>

</html>
