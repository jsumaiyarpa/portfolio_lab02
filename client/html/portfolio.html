<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Preview</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../css/portfolio.css">
</head>

<body>

<header>
    <h1>Portfolio Generator</h1>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="portfolio.html" class="active">Preview</a>
        <a href="template-gallery.html" id="templateGallery">Templates</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<div class="container">

    <div class="actions-bar">
        <a href="form.html?mode=edit" class="btn btn-primary" id="editBtn">Edit Portfolio</a>
        <a href="template-gallery.html" class="btn btn-secondary" id="chooseTemplateBtn">Change Template</a>
        <a href="#" class="btn btn-accent" id="viewLiveTemplateBtn">View as Template</a>
        <button class="btn btn-danger" id="deleteBtn">Delete Portfolio</button>
    </div>

    <div class="profile-card">
        <img id="profileImage" src="../assets/default-avatar.svg" alt="Profile Picture" class="avatar-preview">
        <h1 id="name">Loading...</h1>
        <h3 id="headline" class="headline-text"></h3>
        <p id="tagline" class="tagline-text"></p>
        <div class="bio-box">
            <p id="bio"></p>
        </div>
    </div>

    <div class="card">
        <h2>Contact Information</h2>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>Phone:</b> <span id="contact"></span></p>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div class="skills-grid">
            <div>
                <p><b>Soft Skills:</b></p>
                <div id="softSkills" class="skills-tags"></div>
            </div>
            <div>
                <p><b>Technical Skills:</b></p>
                <div id="techSkills" class="skills-tags"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Education</h2>
        <div id="educationContainer"></div>
    </div>

    <div class="card">
        <h2>Work Experience</h2>
        <div id="experienceContainer"></div>
    </div>

    <div class="card">
        <h2>Projects / Publications</h2>
        <div id="projects" class="projects-content"></div>
    </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/portfolio.js"></script>

</body>
</html>
