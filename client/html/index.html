<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Generator - Login & Signup</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <h2>Portfolio Generator</h2>
        <nav>
            <a href="index.html" id="navHome">Home</a>
            <a href="about.html" id="navAbout">About</a>
            <a href="help.html" id="navHelp">Help</a>
        </nav>
    </header>

    <div class="glow-card">
        <div class="content">
            <h1>Welcome to Portfolio Generator</h1>
            <p>Please log in or sign up to create your portfolio</p>

            <input type="radio" name="tab" id="login" checked>
            <input type="radio" name="tab" id="signup">

            <div class="tabs">
                <label for="login">Login</label>
                <label for="signup">Signup</label>
            </div>

            <div class="form-container">
                <form class="login-form" id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="off" required><br>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password"
                        required><br>

                    <button type="submit" class="img-btn">
                        <img src="../assets/login_btn.png" alt="Login" width="28"> Login
                    </button>
                </form>

                <form class="signup-form" id="signupForm">
                    <input type="text" id="signupName" placeholder="Full Name" autocomplete="off" required><br>
                    <input type="email" id="signupEmail" placeholder="Email Address" autocomplete="off" required><br>
                    <input type="password" id="signupPassword" placeholder="Create Password" autocomplete="new-password"
                        required><br>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password"
                        autocomplete="new-password" required><br>

                    <button type="submit" class="img-btn">
                        <img src="../assets/signup_btn.png" alt="Signup" width="28"> Signup
                    </button>
                </form>
            </div>
        </div>
    </div>

<footer>
    <p>
        &copy; 2026 Portfolio Generator | Designed by Sumaiya Jannat Arpa |
        <a href="https://www.linkedin.com/in/sumaiya-jannat-arpa/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </p>
</footer>

    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
