<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Template - Portfolio Generator</title>
    <link rel="stylesheet" href="../css/template-gallery.css">
</head>

<body>

<header>
    <h1>Portfolio Generator</h1>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="portfolio.html">Preview</a>
        <a href="template-gallery.html" class="active" id="templateGallery">Templates</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<div class="container">

    <h2>Choose Your Portfolio Template</h2>

    <p>Select one template and click Generate Portfolio.</p>

    <div class="templates">

        <div class="template-card" data-template="corporate">

            <img src="../assets/corporate.png" alt="Corporate">

            <h3>Corporate</h3>

        </div>

        <div class="template-card" data-template="glass">

            <img src="../assets/glass.png" alt="Glass">

            <h3>Glass</h3>

        </div>

        <div class="template-card" data-template="minimal">

            <img src="../assets/minimal.png" alt="Minimal">

            <h3>Minimal</h3>

        </div>

        <div class="template-card" data-template="dark">

            <img src="../assets/dark.png" alt="Dark">

            <h3>Dark</h3>

        </div>

    </div>

    <button id="generateBtn">

        Generate Portfolio

    </button>

</div>

<script src="../js/config.js"></script>
<script src="../js/template-gallery.js"></script>

</body>

</html>
